<div class="home-container">
    <!-- Dynamic Island (style iPhone) minimaliste avec boutons intégrés -->
    <div class="dynamic-island" [class.expanded]="islandExpanded" (mouseenter)="showIsland(); closeComments()" (mouseleave)="hideIsland()">
        <div class="island-content">
            <div class="island-icon">
                <div class="dynamic-pill"></div>
            </div>
            <div class="island-text" *ngIf="islandExpanded">
                <!-- Nom utilisateur avec avatar -->
                <div class="panel-trigger-container">
                    <div class="user-info">
                        <span class="user-avatar"></span>
                        <span>{{ userName }}</span>
                    </div>
                    
                    <!-- Menu utilisateur -->
                    <div class="user-menu">
                        <div class="user-menu-content">
                            <div class="menu-item">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="3"></circle>
                                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                                </svg>
                                <span>Paramètres</span>
                            </div>
                            <div class="menu-item logout" (click)="logout()">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                                    <polyline points="16 17 21 12 16 7"></polyline>
                                    <line x1="21" y1="12" x2="9" y2="12"></line>
                                </svg>
                                <span>Déconnexion</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Actions: Civilisations et Recherche -->
                <div class="island-actions">
                    <!-- Sélecteur de civilisations en boutons -->
                    <div class="civilization-buttons">
                        <button 
                            *ngFor="let civ of displayedCivilizations" 
                            class="civ-btn" 
                            [class.active]="selectedCivilization === civ"
                            (click)="selectCivilization(civ)">
                            {{ civ }}
                        </button>
                        <button 
                            class="civ-btn more-btn" 
                            *ngIf="showMoreCivilizations"
                            (mouseenter)="showCivilizationsPanel()"
                            (mouseleave)="hideCivilizationsPanel()">
                            ...
                        </button>
                    </div>
                    
                    <!-- Bouton de recherche -->
                    <button class="island-search-btn" (mouseenter)="showSearch()" (mouseleave)="hideSearch()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </button>
                    
                    <!-- Bouton commentaire dans la Dynamic Island -->
                    <button class="island-comment-btn" (click)="toggleComments(); $event.stopPropagation()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Overlay semi-transparent pour les pop-ups -->
    <div class="popups-overlay" *ngIf="civilizationsPanelOpen || searchOpen" (click)="closeAllPanels()"></div>

    <!-- Panel civilisations (s'affiche au survol sur "...") -->
    <div class="civilizations-panel" *ngIf="civilizationsPanelOpen" (mouseenter)="showCivilizationsPanel()" (mouseleave)="hideCivilizationsPanel()">
        <div class="panel-content" (click)="$event.stopPropagation()">
            <div class="panel-header">
                <h4>Civilisations</h4>
                <button class="close-panel-btn" (click)="toggleCivilizationsPanel()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="civ-grid">
                <button 
                    *ngFor="let civ of civilizations" 
                    class="civ-grid-btn"
                    [class.active]="selectedCivilization === civ"
                    (click)="selectCivilization(civ); toggleCivilizationsPanel()">
                    {{ civ }}
                </button>
            </div>
        </div>
    </div>

    <!-- Panel de recherche avancée (s'affiche au survol du bouton recherche) -->
    <div class="search-panel" *ngIf="searchOpen" (mouseenter)="showSearch()" (mouseleave)="hideSearch()">
        <div class="panel-content search-content" (click)="$event.stopPropagation()">
            <div class="panel-header">
                <h4>Recherche Avancée</h4>
                <button class="close-panel-btn" (click)="toggleSearch()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            
            <div class="search-form">
                <div class="search-field">
                    <label>Événement</label>
                    <input 
                        type="text" 
                        [(ngModel)]="searchEvent" 
                        placeholder="Nom de l'événement..."
                    >
                </div>
                
                <div class="search-field">
                    <label>Période</label>
                    <div class="period-inputs">
                        <input 
                            type="number" 
                            [(ngModel)]="searchStartYear" 
                            placeholder="Année début"
                        >
                        <span>à</span>
                        <input 
                            type="number" 
                            [(ngModel)]="searchEndYear" 
                            placeholder="Année fin"
                        >
                    </div>
                </div>
                
                <div class="search-field">
                    <label>Civilisation</label>
                    <select [(ngModel)]="searchCivilization">
                        <option value="">Toutes les civilisations</option>
                        <option *ngFor="let civ of civilizations" [value]="civ">{{ civ }}</option>
                    </select>
                </div>
                
                <div class="search-field">
                    <label>Type d'événement</label>
                    <div class="event-types">
                        <label class="checkbox-label">
                            <input type="checkbox" [(ngModel)]="searchEventTypes.cultural">
                            <span>Culturel</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" [(ngModel)]="searchEventTypes.political">
                            <span>Politique</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" [(ngModel)]="searchEventTypes.military">
                            <span>Militaire</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" [(ngModel)]="searchEventTypes.scientific">
                            <span>Scientifique</span>
                        </label>
                    </div>
                </div>
                
                <div class="search-actions">
                    <button class="search-reset" (click)="resetSearch()">Réinitialiser</button>
                    <button class="search-submit" (click)="submitSearch()">Rechercher</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Image à droite qui s'agrandit après connexion -->
    <div class="image-container logged-in" #container>  
        <app-time-line-scrolle class="size-full" [selectedCivilization]="selectedCivilization" [searchParams]="activeSearchParams"/>
    </div>
    <button class="follow-button btn" #followButton (click)="buttonClicked()">Clique</button>
    
    <!-- Overlay pour fermer les commentaires en cliquant ailleurs -->
    <div class="overlay" *ngIf="commentsOpen" (click)="toggleComments()"></div>
    
    <!-- Panneau de commentaires simplifié -->
    <div class="comments-panel" [class.open]="commentsOpen">
        <div class="comments-header">
            <h3>Commentaires</h3>
        </div>
        
        <div class="comments-list">
            <div class="comment-item" *ngFor="let comment of comments">
                <div class="comment-avatar"></div>
                <div class="comment-content">
                    <div class="comment-header">
                        <span class="comment-author">{{ comment.author }}</span>
                        <span class="comment-date">{{ comment.date }}</span>
                    </div>
                    <p class="comment-text">{{ comment.text }}</p>
                </div>
            </div>
        </div>
        
        <div class="comment-form">
            <input 
                type="text" 
                class="comment-input" 
                placeholder="Écrire un commentaire..." 
                [(ngModel)]="newComment"
                (keyup.enter)="addComment()"
            >
            <button class="send-comment" [disabled]="!newComment.trim()" (click)="addComment()">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>
</div>
