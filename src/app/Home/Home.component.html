<div class="home-container" [class.shifted]="commentsOpen">
    <!-- Dynamic Island (style iPhone) amélioré -->
    <div class="dynamic-island" [class.expanded]="islandExpanded" (click)="toggleIsland()">
        <div class="island-content">
            <div class="island-icon">
                <div class="dynamic-pill"></div>
            </div>
            <div class="island-text" *ngIf="islandExpanded">
                <div class="civilization-filter" (click)="$event.stopPropagation()">
                    <label>Civilisation</label>
                    <select [(ngModel)]="selectedCivilization">
                        <option *ngFor="let civ of civilizations" [value]="civ">{{ civ }}</option>
                    </select>
                </div>
                <div class="user-info">
                    <span class="user-avatar"></span>
                    <span>{{ userName }}</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Image à droite qui s'agrandit après connexion -->
    <div class="image-container logged-in" #container>  
        <app-time-line-scrolle class="size-full"/>
    </div>
    <button class="follow-button btn" #followButton (click)="buttonClicked()">Clique</button>
    
    <!-- Overlay pour fermer les commentaires en cliquant ailleurs -->
    <div class="overlay" *ngIf="commentsOpen" (click)="toggleComments()"></div>
    
    <!-- Bouton commentaire -->
    <button class="comment-fab" [class.hidden]="commentsOpen" (click)="toggleComments()">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
        </svg>
    </button>

    <!-- Panneau de commentaires amélioré -->
    <div class="comments-panel" [class.open]="commentsOpen">
        <div class="comments-header">
            <h3>Commentaires</h3>
            <button class="close-comments" (click)="toggleComments()">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
        
        <div class="comments-list">
            <div class="comment-item" *ngFor="let comment of comments">
                <div class="comment-avatar"></div>
                <div class="comment-content">
                    <div class="comment-header">
                        <span class="comment-author">{{ comment.author }}</span>
                        <span class="comment-date">{{ comment.date }}</span>
                    </div>
                    <p class="comment-text">{{ comment.text }}</p>
                </div>
            </div>
        </div>
        
        <div class="comment-form">
            <input 
                type="text" 
                class="comment-input" 
                placeholder="Écrire un commentaire..." 
                [(ngModel)]="newComment"
                (keyup.enter)="addComment()"
            >
            <button class="send-comment" [disabled]="!newComment.trim()" (click)="addComment()">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>
</div>
