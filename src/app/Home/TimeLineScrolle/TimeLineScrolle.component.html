<div class="timeline-container" #timelineContainer (wheel)="onScroll($event)">
    <!-- Indicateur de chargement -->
    <div *ngIf="loading" class="loading-container">
        <div class="loading-spinner"></div>
        <p>Chargement des événements historiques enrichis...</p>
    </div>
    
    <!-- Message d'erreur -->
    <div *ngIf="error" class="error-container">
        <p>{{ error }}</p>
        <button (click)="loadEvents()">Réessayer</button>
    </div>

    <!-- Affichage normal (seulement si pas de chargement ni d'erreur) -->
    <ng-container *ngIf="!loading && !error">
        <!-- Timeline scrollable avec point central -->
        <div class="timeline-sidebar">
            <div class="timeline-track" #timelineTrack>
                <div class="timeline-line"></div>
                <div class="timeline-items" 
                     [style.transform]="'translateY(' + timelineOffset + 'px)'">
                    <div *ngFor="let event of filteredEvents; let i = index" 
                         class="timeline-item"
                         [class.active]="event.active"
                         (click)="onYearClick(i)">
                        <div class="timeline-point">
                            <div class="timeline-dot"></div>
                        </div>
                        <div class="timeline-content-item">
                            <div class="timeline-year">
                                {{ event.year < 0 ? event.year * -1 + ' av. J.-C.' : event.year }}
                            </div>
                            <div class="timeline-title">{{ event.title }}</div>
                            <div class="timeline-description" *ngIf="event.active">
                                {{ event.description }}
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Contenu principal avec image de fond seulement -->
        <div class="timeline-content">
            <div *ngFor="let event of filteredEvents; let i = index"
                 class="event-section"
                 [class.active]="event.active"
                 [style.--event-background]="event.medias && event.medias.length > 0 ? 'url(' + event.medias[0].url + ')' : ''">
                <!-- Plus de contenu texte ici, juste l'image de fond -->
            </div>
        </div>
    </ng-container>
</div>

<!-- Modal pour afficher les médias en grand - conservé pour compatibilité -->
<div *ngIf="selectedMedia" class="media-modal" (click)="closeMediaModal()">
    <div class="media-modal-content" (click)="$event.stopPropagation()">
        <button class="modal-close" (click)="closeMediaModal()">&times;</button>
        
        <img *ngIf="selectedMedia.type === 'IMAGE'" 
             [src]="selectedMedia.url" 
             [alt]="selectedMedia.title"
             class="modal-media">
        
        <video *ngIf="selectedMedia.type === 'VIDEO'" 
               [src]="selectedMedia.url" 
               class="modal-media"
               controls
               autoplay>
        </video>
        
        <div class="modal-info">
            <h4>{{ selectedMedia.title }}</h4>
            <p *ngIf="selectedMedia.description">{{ selectedMedia.description }}</p>
        </div>
    </div>
</div>
