<div class="timeline-container" #timelineContainer (wheel)="onScroll($event)">
    <!-- Indicateur de chargement -->
    <div *ngIf="loading" class="loading-container">
        <div class="loading-spinner"></div>
        <p>Chargement des événements historiques...</p>
    </div>
    
    <!-- Message d'erreur -->
    <div *ngIf="error" class="error-container">
        <p>{{ error }}</p>
        <button (click)="loadEvents()">Réessayer</button>
    </div>

    <!-- Affichage normal (seulement si pas de chargement ni d'erreur) -->
    <ng-container *ngIf="!loading && !error">
        <!-- Sidebar avec les années -->
        <ul class="timeline timeline-vertical timeline-years">
            <li *ngFor="let event of filteredEvents; let i = index; let first = first; let last = last">
                <hr *ngIf="!first" />
                <div class="timeline-start">
                    {{ event.year < 0 ? event.year * -1 + ' av. J.-C.' : event.year }}
                </div>
                <div class="timeline-middle" 
                     [class.active]="event.active"
                     (click)="onYearClick(i)">
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 20 20"
                        fill="currentColor"
                        class="h-5 w-5">
                        <path
                            fill-rule="evenodd"
                            d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.857-9.809a.75.75 0 00-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 10-1.06 1.061l2.5 2.5a.75.75 0 001.137-.089l4-5.5z"
                            clip-rule="evenodd" />
                    </svg>
                </div>
                <div class="timeline-end timeline-box bg-transparent ml-3" [class.active]="event.active">
                    {{ event.title }}
                </div>
                <hr *ngIf="!last" />
            </li>
        </ul>
        
        <!-- Contenu principal avec l'événement actif -->
        <div class="timeline-content">
            <div *ngFor="let event of filteredEvents; let i = index"
                 class="event-section"
                 [class.active]="event.active"
                 [style.--event-background]="'url(' + event.image + ')'">
                
                <div *ngIf="event.active" class="event-container">
                    <h2 class="event-title">{{ event.title }}</h2>
                    <div class="event-year">{{ event.year < 0 ? event.year * -1 + ' av. J.-C.' : event.year }}</div>
                    <p class="event-description">{{ event.description }}</p>
                    
                    <!-- L'image est cachée car utilisée comme fond -->
                    <div class="event-image" style="display: none;">
                        <img [src]="event.image" alt="{{ event.title }}">
                    </div>
                </div>
            </div>
        </div>
    </ng-container>
</div>
